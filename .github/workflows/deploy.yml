name: Build and Deploy

on:
  push:
    branches: [main, release/*]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: nginx
            dockerfile: docker/nginx/Dockerfile
            build-args: ""

          - name: server
            dockerfile: docker/server/Dockerfile
            build-args: |
              NODE_ENV=production

          - name: client
            dockerfile: docker/client/Dockerfile
            build-args: |
              NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from secret and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 작업 디렉토리 생성
            mkdir -p /app/web16-UTMate
            cd /app/web16-UTMate

            # .env 파일 생성 (전체 내용 시크릿에서 전달)
            cat > .env << 'ENV_EOF'
            ${{ secrets.ENV_FILE_CONTENT }}
            ENV_EOF

            # docker-compose.yml 복사
            cat > docker-compose.yml << 'COMPOSE_EOF'
            ${{ vars.DOCKER_COMPOSE_CONTENT }}
            COMPOSE_EOF

            # GitHub Container Registry 로그인
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 최신 이미지 pull
            docker-compose pull

            # 서비스 재시작
            docker-compose up -d

            # 사용하지 않는 이미지 정리
            docker image prune -f
