# 배포 후 E2E 테스트 워크플로우
# deploy.yml(Build and Deploy)이 성공적으로 완료된 후 자동 실행됩니다.
# 배포된 프론트엔드 URL에서 Playwright로 핵심 UI를 검증합니다.
name: Post Deploy E2E Test

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
    branches: [main]

jobs:
  e2e:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    # 배포가 성공했을 때만 E2E 실행 (실패 시 스킵)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright 브라우저 바이너리 캐시 (설치 시간 단축)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/client/package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/client
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/client
        run: pnpm exec playwright install-deps chromium

      # 배포 서버가 완전히 기동될 때까지 대기 (최대 150초)
      - name: Wait for deployment to be ready
        run: |
          echo "배포 URL 응답 대기 중: ${{ vars.E2E_BASE_URL }}"
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "${{ vars.E2E_BASE_URL }}/login" > /dev/null; then
              echo "서버 준비 완료 ($i번째 시도)"
              exit 0
            fi
            echo "대기 중... ($i/30)"
            sleep 5
          done
          echo "서버 응답 타임아웃"
          exit 1

      # E2E 테스트 실행
      - name: Run E2E tests
        working-directory: apps/client
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: pnpm exec playwright test

      # 테스트 결과 리포트 및 실패 시 스크린샷을 아티팩트로 업로드
      # GitHub Actions 탭 → 해당 실행 → Artifacts 섹션에서 zip으로 다운로드 가능
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 7
