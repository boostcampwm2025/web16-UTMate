version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: utmate
      MYSQL_USER: utmate
      MYSQL_PASSWORD: utmate
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # nginx 설정 파일 매핑
      - ./dev/nginx.conf:/etc/nginx/nginx.conf:ro
      #sdk 빌드 결과 폴더 매핑
      - ./apps/sdk/dist:/usr/share/nginx/html/sdk

volumes:
  mysql_data:
  redis_data:
