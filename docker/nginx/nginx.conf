events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name utmate.me www.utmate.me;
        
        # Let's Encrypt 인증용 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name utmate.me www.utmate.me;
    
        # SSL 인증서 경로
        ssl_certificate /etc/letsencrypt/live/utmate.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/utmate.me/privkey.pem;
    
        # SDK 정적 파일 서빙
        location /sdk/ {
            alias /usr/share/nginx/html/sdk/;
            try_files $uri $uri/ =404;
        }
    
        # Server API 프록시
        location /api/ {
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        # Client (Frontend) 프록시
        location / {
            proxy_pass http://client:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}