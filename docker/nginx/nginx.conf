events { worker_connections 1024; }

http {

    upstream api_server {
        server server:8080;
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    upstream client {
        server client:3000;
    }

    # 프록시 타임아웃 설정 (글로벌)
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;

    # HTTP/2 설정
    http2_max_concurrent_streams 128;
    http2_recv_timeout 30s;
    
    # 클라이언트 연결 타임아웃
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name utmate.me www.utmate.me;
        
        # Let's Encrypt 인증용 경로
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name utmate.me www.utmate.me;

        # SSL 인증서 경로
        ssl_certificate /etc/letsencrypt/live/utmate.me/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/utmate.me/privkey.pem;

        # https://ssl-config.mozilla.org/ 참고
        # SSL 프로토콜 및 암호화 강화
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # SSL session 캐시 (TLS handshake 성능 향상)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets on; # default 설정 사용

        # OCSP 스테이플링 무시 (let's encrypt는 OCSP 지원 중단)

        # HSTS 설정
        add_header Strict-Transport-Security "max-age=63072000" always;

        # SDK 정적 파일 서빙
        location /sdk/ {
            alias /usr/share/nginx/html/sdk/;
            try_files $uri $uri/ =404;
            add_header Access-Control-Allow-Origin *;
        }
    
        # Server API 프록시
        location /api/ {
            proxy_pass http://api_server;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Client (Frontend) 프록시
        location / {
            proxy_pass http://client;

            proxy_http_version 1.1;
            proxy_set_header Connection "close";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}